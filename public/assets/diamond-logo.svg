<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Diamond (rotated square) drawn first - bottom layer -->
    <rect x="50" y="50" width="100" height="100" fill="rgb(206, 177, 79)" transform="rotate(45 100 100)" />

    <!-- Normal square drawn second - top layer with transparency -->
    <rect x="50" y="50" width="100" height="100" fill="#EDE5C8" fill-opacity="0.7" />
</svg>