<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f5e9c8" />
            <stop offset="50%" style="stop-color:#d4af37" />
            <stop offset="100%" style="stop-color:#b8962e" />
        </linearGradient>
    </defs>
    <!-- Diamond shape (rotated square) -->
    <rect x="4" y="4" width="24" height="24" rx="2" fill="url(#gold)" transform="rotate(45 16 16)" />
    <!-- Highlight -->
    <rect x="8" y="8" width="10" height="10" fill="rgba(255,255,255,0.3)" transform="rotate(45 16 16)" />
</svg>